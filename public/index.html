  <!-- Schema.org Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Dilek Ağacı",
    "description": "Bir dilek yaz, ağaçta bir çiçek açsın. Dünyanın dört bir yanından insanların umutlarının buluştuğu ortak dijital dilek ağacı.",

    "applicationCategory": "SocialNetworkingApplication",
    "operatingSystem": "Web",
    "inLanguage": "tr",

      "@type": "Person",
      "name": "dixtuel",
      "url": "https://dxtl.com.tr"
    }
  }
  </script>

<body>
  <!-- Animated sky background -->
  <div class="sky" id="sky" aria-hidden="true">
    <div class="sky-stars"></div>
    <div class="sky-wishes" id="sky-wishes"></div>
    <div class="fireflies" id="fireflies"></div>
  </div>

  <!-- Ground silhouette at base -->
  <div class="ground" aria-hidden="true"></div>

  <!-- Header -->
  <header class="topbar">
    <a class="wordmark" href="/">
      <span class="wordmark-leaf" aria-hidden="true">🌿</span>
      Dilek <span class="wordmark-accent">Ağacı</span>
    </a>
    <button class="cta glass-btn" id="open-form">
      <span class="cta-sparkle" aria-hidden="true">✨</span>
      Bir Dilek Bırak
    </button>
  </header>

  <!-- Main stage -->
  <main class="stage">
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMax meet" aria-label="Dilek ağacı">
        <defs>
          <linearGradient id="bark-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a2a42" />
            <stop offset="100%" stop-color="#1e1622" />
          </linearGradient>
          <filter id="blossom-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
      </svg>
    </div>

    <div class="counter-pill" id="counter" aria-live="polite">
      ağaç henüz sessiz, ilk dileği sen bırak
    </div>
  </main>

  <!-- Wish tooltip (shows on blossom/star hover) -->
  <div class="wish-tooltip glass-card" id="wish-tooltip" role="status" hidden></div>

  <!-- Credit -->
  <a class="credit" href="https://dxtl.com.tr" target="_blank" rel="noopener">Made by dixtuel</a>

  <!-- Wish form panel (side panel on desktop, bottom sheet on mobile) -->
  <div class="panel-backdrop" id="panel-backdrop" hidden></div>
  <aside class="panel glass-panel" id="panel" hidden aria-labelledby="panel-title">
    <div class="panel-handle" aria-hidden="true"></div>
    <button class="panel-close" id="panel-close" aria-label="Kapat">✕</button>
    <h2 id="panel-title">Bir dilek bırak</h2>
    <p class="panel-hint">Dileğin ağaçta bir çiçek olarak açacak. Herkes okuyabilir, o yüzden nazik ol.</p>

    <form id="wish-form" novalidate>
      <label for="name">İsim <span>(opsiyonel)</span></label>
      <input id="name" name="name" type="text" maxlength="40" autocomplete="off" placeholder="Adın ya da rumuzun" />

      <label for="text">Dileğin</label>
      <textarea id="text" name="text" maxlength="220" rows="4" required placeholder="Dileğini buraya yaz…"></textarea>
      <div class="char-count"><span id="char-count">0</span>/220</div>

      <div class="h-captcha" id="hcaptcha-widget" data-sitekey="__HCAPTCHA_SITE_KEY__" data-theme="dark" data-size="normal"></div>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <button type="submit" class="submit glow-btn" id="submit-btn">Ağaca bırak</button>
    </form>

    <p class="panel-footer"><a href="terms.html">Şartlar &amp; Gizlilik</a></p>
  </aside>

  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <script src="tree.js"></script>
</body>
</html>
