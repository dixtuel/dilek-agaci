  <!-- Schema.org Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Dilek Ağacı",
    "description": "Bir dilek yaz, ağaçta bir çiçek açsın. Dünyanın dört bir yanından insanların umutlarının buluştuğu ortak dijital dilek ağacı.",
    "url": "https://dilekagaci.onrender.com",
    "applicationCategory": "SocialNetworkingApplication",
    "operatingSystem": "Web",
    "inLanguage": "tr",

      "@type": "Person",
      "name": "dixtuel",

  }

</head>
<body>
  <!-- Ambient background -->
  <div class="sky" id="sky" aria-hidden="true">
    <div class="sky-particles"></div>
  </div>

  <!-- Header -->
  <header class="topbar">
    <a class="wordmark" href="/">
      <span class="wordmark-leaf" aria-hidden="true">🌸</span>
      Dilek <span class="wordmark-accent">Ağacı</span>
    </a>
    <button class="cta-btn" id="open-form">
      <span class="cta-icon" aria-hidden="true">✨</span>
      Bir Dilek Bırak
    </button>
  </header>

  <!-- Main stage -->
  <main class="stage">
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMax meet" aria-label="Dilek ağacı">
        <defs>
          <linearGradient id="bark-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8a654c" />
            <stop offset="60%" stop-color="#6b4c37" />
            <stop offset="100%" stop-color="#4a3325" />
          </linearGradient>
          <filter id="petal-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#5c4033" flood-opacity="0.18" />
          </filter>
        </defs>
      </svg>
    </div>

    <!-- Sky wishes (ascending stars/petals container) -->
    <div class="sky-wishes" id="sky-wishes"></div>

    <div class="counter-pill" id="counter" aria-live="polite">
      ağaç henüz sessiz, ilk dileği sen bırak
    </div>
  </main>

  <!-- Wish Card Modal / Tooltip -->
  <div class="wish-card-backdrop" id="wish-card-backdrop" hidden></div>
  <div class="wish-card-dialog" id="wish-card-dialog" role="dialog" aria-modal="true" hidden>
    <button class="wish-card-close" id="wish-card-close" aria-label="Kapat">✕</button>
    <div class="wish-card-tag">🌸 Bir Dilek</div>
    <p class="wish-card-text" id="wish-card-text"></p>
    <div class="wish-card-meta">
      <span class="wish-card-who" id="wish-card-who"></span>
      <span class="wish-card-when" id="wish-card-when"></span>
    </div>
  </div>

  <!-- Credit -->
  <a class="credit" href="https://dxtl.com.tr" target="_blank" rel="noopener">Made by dixtuel</a>

  <!-- Wish Form Panel -->
  <div class="panel-backdrop" id="panel-backdrop" hidden></div>
  <aside class="panel" id="panel" hidden aria-labelledby="panel-title">
    <div class="panel-handle" aria-hidden="true"></div>
    <button class="panel-close" id="panel-close" aria-label="Kapat">✕</button>
    <h2 id="panel-title">Bir dilek bırak</h2>
    <p class="panel-hint">Dileğin ağaçta taze bir kiraz çiçeği olarak açacak. Herkes okuyabilir, o yüzden nazik ol.</p>

    <form id="wish-form" novalidate>
      <label for="name">İsim <span>(opsiyonel)</span></label>
      <input id="name" name="name" type="text" maxlength="40" autocomplete="off" placeholder="Adın ya da rumuzun" />

      <label for="text">Dileğin</label>
      <textarea id="text" name="text" maxlength="220" rows="4" required placeholder="Gönlünden geçen dileği yaz…"></textarea>
      <div class="char-count"><span id="char-count">0</span>/220</div>

      <div class="h-captcha" id="hcaptcha-widget" data-sitekey="__HCAPTCHA_SITE_KEY__" data-theme="light" data-size="normal"></div>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <button type="submit" class="submit-btn" id="submit-btn">Ağaca As</button>
    </form>

    <p class="panel-footer"><a href="terms.html">Şartlar &amp; Gizlilik</a></p>
  </aside>

  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <script src="tree.js"></script>
</body>
</html>
