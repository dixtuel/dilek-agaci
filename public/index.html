  <!-- Cache validation & Client-side Zero-cost Language Detection -->
  <script>
    (function(){
      var V = "20260823.32";
      try {
        if (localStorage.getItem("__dilek_v") !== V) {
          localStorage.setItem("__dilek_v", V);
          if (sessionStorage.getItem("__reloaded") !== V) {
            sessionStorage.setItem("__reloaded", V);
            location.reload(true);
          }
        }
      } catch(e){}

      // Automatic Language Detection on first visit
      try {
        var savedLang = localStorage.getItem("preferred_lang");
        if (!savedLang) {
          var userLang = (navigator.language || navigator.userLanguage || "tr").toLowerCase();
          var isTurkic = userLang.startsWith("tr") || userLang.startsWith("az");
          if (!isTurkic) {
            localStorage.setItem("preferred_lang", "en");
            window.location.replace("/en/");
          } else {
            localStorage.setItem("preferred_lang", "tr");
          }
        }
      } catch(e){}
    })();
  </script>

  <!-- Main stage -->
  <main class="stage">
    <!-- Hardware-accelerated 60FPS falling sakura petals canvas covering tree and grass -->

    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 1050 950" preserveAspectRatio="xMidYMax meet" aria-label="Dilek ağacı">
        <defs>
          <linearGradient id="bark-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6B5650" />
            <stop offset="45%" stop-color="#584540" />
            <stop offset="100%" stop-color="#3E322F" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Sky wishes (ascending stars container) -->
    <div class="sky-wishes" id="sky-wishes"></div>

    <!-- Organic Grass & Terrain Mound -->
    <div class="ground-terrain">
      <svg viewBox="0 0 1200 140" preserveAspectRatio="none" class="ground-svg" aria-hidden="true">
        <path d="M 0,80 Q 300,20 600,45 T 1200,60 L 1200,140 L 0,140 Z" fill="#8E829B" opacity="0.85"></path>

        <ellipse cx="720" cy="100" rx="3.5" ry="1.8" fill="#FFF2F5" opacity="0.7" transform="rotate(-30 720 100)"></ellipse>
      </svg>

      <!-- Counter Pill sits prominently above the hill ground -->
      <div class="counter-pill" id="counter" aria-live="polite">
        <svg class="mini-blossom-svg" viewBox="0 0 24 24" width="17" height="17">
          <g transform="translate(12,12)">
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#FCAEB8" transform="rotate(0)"/>
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#FFD1DC" transform="rotate(72)"/>
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#FCAEB8" transform="rotate(144)"/>

            <circle cx="0" cy="0" r="2.2" fill="#FFF2F5"/>
          </g>
        </svg>
        <span>ağaç henüz sessiz, ilk dileği sen bırak</span>
      </div>
    </div>
