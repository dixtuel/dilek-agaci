<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dilek Ağacı</title>
<meta name="description" content="Bir dilek yaz, ağaçta bir çiçek açsın. Herkesin ortak dilek ağacı." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23241a2e'/%3E%3Ccircle cx='16' cy='14' r='6' fill='%23e8785a'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
  </div>

  <header class="topbar">
    <a class="wordmark" href="/">Dilek <span>Ağacı</span></a>
    <button class="cta" id="open-form">Dilek bırak</button>
  </header>

  <main class="stage">
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMax meet" aria-label="Dilek ağacı"></svg>
    </div>

    <p class="counter" id="counter" aria-live="polite">ağaç henüz sessiz, ilk dileği sen bırak</p>
  </main>

  <div class="wish-tooltip" id="wish-tooltip" role="status" hidden></div>

  <a class="credit" href="https://dxtl.com.tr" target="_blank" rel="noopener">Made by dixtuel</a>

  <div class="panel-backdrop" id="panel-backdrop" hidden></div>
  <aside class="panel" id="panel" hidden aria-labelledby="panel-title">
    <button class="panel-close" id="panel-close" aria-label="Kapat">✕</button>
    <h2 id="panel-title">Bir dilek bırak</h2>
    <p class="panel-hint">Dileğin ağaçta bir çiçek olarak açacak. Herkes okuyabilir, o yüzden nazik ol.</p>

    <form id="wish-form" novalidate>
      <label for="name">İsim <span>(opsiyonel)</span></label>
      <input id="name" name="name" type="text" maxlength="40" autocomplete="off" placeholder="Adın ya da rumuzun" />

      <label for="text">Dileğin</label>
      <textarea id="text" name="text" maxlength="220" rows="4" required placeholder="Dileğini buraya yaz…"></textarea>
      <div class="char-count"><span id="char-count">0</span>/220</div>

      <div class="h-captcha" id="hcaptcha-widget" data-sitekey="__HCAPTCHA_SITE_KEY__" data-theme="dark" data-size="normal"></div>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <button type="submit" class="submit" id="submit-btn">Ağaca bırak</button>
    </form>

    <p class="panel-footer"><a href="terms.html">Şartlar &amp; Gizlilik</a></p>
  </aside>

  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <script src="tree.js"></script>
</body>
</html>
